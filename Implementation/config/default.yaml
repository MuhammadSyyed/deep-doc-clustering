experiment:
  name: "baseline_known_k"
  seed: 42
  n_runs: 1
  output_dir: "results/"

dataset:
  name: "dataset_name"
  subset: null
  custom_path: null
  text_col: "text"
  label_col: "label"
  max_samples: 150000


preprocessing:
  enabled_for: ["tfidf"]
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  min_token_len: 2
  max_seq_len: 512


encoder:
  name: "encoder"

  tfidf:
    max_features: 10000
    ngram_range: [1, 2]
    sublinear_tf: true

  sbert:
    model_name: "all-mpnet-base-v2"
    batch_size: 64
    normalize: true


reduction:
  use_pca: true
  method: "pca"
  n_components: 0.95


clustering:
  name: "clusterer"
  k: 'true'

  kmeans:
    n_init: 20
    max_iter: 500
    algorithm: "lloyd"
    random_state: 42

  idec:
    hidden_dim: 256
    latent_dim: 128
    lr: 1e-3

    batch_size: 256

    pretrain_epochs: 100
    epochs: 200

    update_interval: 10
    lambda_kl: 1.0
    tol: 1e-3

    device: "cuda"

  sdcn:
    lr: 3e-3
    epochs: 200
    pretrain_epochs: 100

    latent_dim: 128
    knn_k: 15

    alpha: 1.0
    beta: 0.3
    update_interval: 10
    tol: 1e-3

    device: "cuda"

evaluation:
  mode: "label"

  metrics:
    label: ["acc", "nmi", "ari", "purity"]
    intrinsic: ["silhouette", "davies_bouldin"]

  hungarian_matching: true

logging:
  save_embeddings: true
  save_predictions: true
  save_model: false
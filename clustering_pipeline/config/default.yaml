experiment:
  name: "baseline_unsupervised_unknown_k"
  seed: 42
  n_runs: 1
  output_dir: "results/"

dataset:
  name: "20newsgroups"
  subset: null
  custom_path: null
  text_col: "text"
  label_col: "label"
  max_samples: null


preprocessing:
  enabled_for: ["tfidf","doc2vec"]
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  min_token_len: 2
  max_seq_len: 512


encoder:
  name: "sbert"

  tfidf:
    max_features: 10000
    ngram_range: [1, 2]
    sublinear_tf: true

  lexical_chain:
    similarity_threshold: 0.5
    chain_weighting: "length"

  word2vec:
    pretrained_path: null
    vector_size: 300
    window: 5
    min_count: 2
    epochs: 10
    aggregation: "mean"

  doc2vec:
    vector_size: 300
    window: 5
    min_count: 2
    epochs: 20
    dm: 1

  sbert:
    model_name: "all-mpnet-base-v2"
    batch_size: 32
    normalize: true


reduction:
  method: "pca"
  n_components: 0.95


clustering:
  name: "kmeans"
  k: "auto" # auto or int

  kmeans:
    n_init: 20
    max_iter: 500
    algorithm: "lloyd"
    random_state: 42

  ae:
    hidden_dim: 256
    latent_dim: 64
    lr: 0.001
    epochs: 500
    patience: 20
    min_delta: 1e-4

  idec:
    hidden_dim: 256
    latent_dim: 64
    lr: 0.001
    pretrain_epochs: 300
    epochs: 500
    lambda_rec: 1.0
    patience: 20
    min_delta: 1e-4
    tol: 1e-3
    update_interval: 5

  gcn:
    knn_k: 15
    knn_metric: "cosine"
    hidden_dim: 256
    output_dim: 128
    num_layers: 2
    dropout: 0.3
    epochs: 200
    lr: 0.001
    weight_decay: 5.0e-4
    final_clustering: "kmeans"

evaluation:
  mode: "both"   # label or intrinsic or both

  metrics:
    label: ["acc", "nmi", "ari", "purity"]
    intrinsic: ["silhouette", "davies_bouldin"]

  hungarian_matching: true

logging:
  save_embeddings: true
  save_predictions: true
  save_model: false